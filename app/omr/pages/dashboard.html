<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OMR | System Monitoring</title>

    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
    <link rel="manifest" href="img/icons/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/aperture.css">
</head>

<body>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/aperture.js"></script>

    <div class="grid">
        <div class="card">
            <h2>CPU</h2>
            <div class="bar">
                <div id="cpu-bar"></div>
            </div>

            <div class="metric">
                <span class="label highlight">Overall Usage</span>
                <span class="value highlight" id="cpu-overall"></span>
            </div>

            <div class="metric">
                <span class="label">Frequency</span>
                <span class="value" id="cpu-mhz"></span>
            </div>

            <div class="metric">
                <span class="label">CPU Threads</span>
                <span class="value" id="cpu-threads"></span>
            </div>
        </div>
        <div class="card">
            <h2>Memory</h2>

            <div class="bar">
                <div id="omr-memory-bar"></div>
                <div id="other-memory-bar"></div>
            </div>

            <div class="metric">
                <span class="label highlight">OMR Memory Use</span>
                <span class="value highlight" id="memory-omr"></span>
            </div>

            <div class="metric peak">
                <span class="label">Peak</span>
                <span class="value" id="omr-memory-peak"></span>
            </div>
            
            <div class="metric">
                <span class="label">Total Memory Use</span>
                <span class="value" id="memory-used"></span>
            </div>

            <div class="metric">
                <span class="label">Available</span>
                <span class="value" id="memory-free"></span>
            </div>

        </div>
        <div class="card">
            <h2>Disk</h2>

            <div class="bar">
                <div id="omr-disk-bar"></div>
                <div id="other-disk-bar"></div>
            </div>

            <div class="metric">
                <span class="label highlight">OMR Disk Use</span>
                <span class="value highlight" id="disk-omr-total"></span>
            </div>

            <div class="metric">
                <span class="label">Total Disk Use</span>
                <span class="value" id="disk-used"></span>
            </div>

            <div class="metric">
                <span class="label">Available Disk</span>
                <span class="value" id="disk-available"></span>
            </div>
        </div>
        <main class="main">
            <div class="uptime-container">
                <div>
                    <h1 id="uptime"></h1>
                    <p class="uptime-label">Uptime</p> 
                </div>
            </div>
            <div class="jobs-text">
            </div>
            <table id="jobs-table">
                <thead>
                    <tr>
                        <th>Endpoint</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Started</th>
                        <th>Finished</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="jobs-output">
                </tbody>
            </table>
        </main>
        <div class="logo-container">
            <div class="logo">
                <h1>
                    <div class="camera-aperture">
                        <div class="blade-box">
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                        </div>
                    </div>
                    <span class="text">mr</span>            
                </h1>
                <p>
                    <span class="by">by</span>
                    <span class="aperture">Aperture</span>
                </p>        
            </div>
        </div>
        <div class="logs clickable">
            <a href="/system/logs" target="_blank">
                <p id="logs-output"></p>
            </a>
        </div>  
    </div>
</body>

</html>
