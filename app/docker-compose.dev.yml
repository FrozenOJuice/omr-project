services:
  backend:
    command: ["sh", "./entrypoint.dev.sh"]
    env_file: .env.dev
    environment:
      DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db_test

  frontend:
    build:
      context: ./frontend
      target: build
    command:
      - npm
      - start
      - --
      - --host
      - 0.0.0.0
      - --port
      - "4200"
      - --poll
      - "1000"
      - --proxy-config
      - proxy.docker.conf.json
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  omr_service:
    env_file: .env.dev
    environment:
      OMR_MODE: DEVELOPMENT
    ports:
      - "3000:3000"

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: capstone_test
    ports:
      - "5434:5432"

  garage-store:
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
    volumes:
      - ./garage_meta:/var/lib/garage/meta
      - ./garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro

volumes:
  frontend_node_modules:
