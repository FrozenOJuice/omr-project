<div class="grade-roster col-flex-container">

    <div class="search-wrapper">
        <span class="material-icons-outlined search-icon">search</span>
        <input class="search-input" type="text" placeholder="Search students..." [(ngModel)]="search" />
    </div>

    <div class="roster-list col-flex-container">
        @if (rows().length === 0) {
        <span class="empty-text">No students found.</span>
        }

        @for (row of rows(); track row.gradeId) {
        <button type="button" class="roster-row" [class.current]="row.gradeId === currentGradeId()"
            (click)="onSelect(row)">
            <div class="roster-row-main col-flex-container">
                <span class="roster-name">{{ row.name }}</span>
                @if (row.studentNumber) {
                <span class="roster-id">{{ row.studentNumber }}</span>
                }
            </div>
            <div class="roster-row-end col-flex-container align-items-end">
                @if (row.percent !== null) {
                <span class="roster-percent">{{ row.percent }}%</span>
                }
                @if (row.needsReview) {
                <span class="status-badge tag-amber">Needs review</span>
                }
            </div>
        </button>
        }
    </div>

</div>
