server {
    listen 80;

    # Matches the backend's own MAX_FILE_SIZE (scan_router.py) — nginx's
    # 1MB default would otherwise reject scan PDF uploads with a bare 413
    # before the request ever reaches the backend.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}