x-canvas-service: &canvas-service
  image: ${CANVAS_IMAGE}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    RAILS_ENV: production
    RAILS_HOST_WITH_PORT: ${CANVAS_HOST}
  volumes:
    - ./config/cache_store.yml:/usr/src/app/config/cache_store.yml:ro
    - ./config/database.yml:/usr/src/app/config/database.yml:ro
    - ./config/delayed_jobs.yml:/usr/src/app/config/delayed_jobs.yml:ro
    - ./config/domain.yml:/usr/src/app/config/domain.yml:ro
    - ./config/environments/production-local.rb:/usr/src/app/config/environments/production-local.rb:ro
    - ./config/file_store.yml:/usr/src/app/config/file_store.yml:ro
    - ./config/outgoing_mail.yml:/usr/src/app/config/outgoing_mail.yml:ro
    - ./config/redis.yml:/usr/src/app/config/redis.yml:ro
    - ./config/security.yml:/usr/src/app/config/security.yml:ro
    - ./scripts/seed.rb:/usr/src/app/script/capstone_seed.rb:ro
    - canvas-brandable-css:/usr/src/app/public/dist/brandable_css
    - canvas-files:/usr/src/app/tmp/files
    - canvas-logs:/usr/src/app/log
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *canvas-service
    build:
      context: ./canvas-lms
      dockerfile: Dockerfile.production
    ports:
      - "127.0.0.1:${CANVAS_PORT}:80"
    healthcheck:
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 90s
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/login/canvas >/dev/null || exit 1"]

  job:
    <<: *canvas-service
    command: bundle exec script/delayed_job run

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 10s
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    volumes:
      - canvas-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    healthcheck:
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 10s
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - canvas-redis:/data

volumes:
  canvas-brandable-css:
  canvas-files:
  canvas-logs:
  canvas-postgres:
  canvas-redis:
